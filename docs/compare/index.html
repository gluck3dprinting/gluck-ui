  .panel { background: var(--color-bg-surface); border: var(--border-width) solid var(--color-border-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }

  .panel__frame { width: 760px; height: 540px; overflow: hidden; background: var(--color-bg-surface); }
  .panel iframe { display: block; width: 1060px; height: 754px; border: 0; background: var(--color-bg-surface); transform: scale(.717); transform-origin: top left; }
  .arrow { display: grid; place-items: center; color: var(--color-text-brand); }
  .arrow svg { width: 40px; height: 40px; stroke-width: 2; }
  .foot { margin-top: var(--space-4); display: flex; justify-content: space-between; font: var(--font-caption); color: var(--color-text-tertiary); }
  .foot b { color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }
</style>
